<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Rivers Academy | Student Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-brand">
            <div class="school-logo">TRA</div>
            <h1>Three Rivers Academy</h1>
            <p>Student Management Portal</p>
        </div>

        <div class="login-card">

            <h2>Welcome back 👋</h2>
            <p class="login-subtitle">
                Sign in to access your school portal.
            </p>

            <form id="loginForm">

                <label>Student ID / Email</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter your student ID"
                    required
                >

                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <div class="login-options">
                    <label class="remember">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit" class="primary-button">
                    Sign In
                </button>

            </form>

            <p id="loginMessage" class="login-message"></p>

        </div>

        <p class="copyright">
            © 2026 Three Rivers Academy
        </p>

    </div>

    <script src="js/app.js"></script>
</body>
</html>
